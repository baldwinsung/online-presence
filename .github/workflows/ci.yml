name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The tests use fake lookups: no network needed.
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/onlinepresence-server
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
