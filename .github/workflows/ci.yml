name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Latest 1.26 patch release: go.mod's "go 1.26.0" is the minimum,
          # and govulncheck fails on an old patch's standard library.
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The tests use fake lookups: no network needed.
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/onlinepresence-server
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
